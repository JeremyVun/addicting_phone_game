name: settle
description: "Settle - a one-thumb block puzzle for Android."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.38.2
  flame_audio: ^2.12.2
  google_mobile_ads: ^9.1.0
  in_app_purchase: ^3.3.0
  # 0.5.1+ requires Flutter 3.44; this SDK is 3.41.
  in_app_purchase_android: 0.5.0
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.0.0
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.0
  share_plus: ^12.0.0
  collection: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/fonts/OFL.txt
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/icon-1024.png"
  min_sdk_android: 24
  adaptive_icon_background: "#0D1016"
  adaptive_icon_foreground: "assets/icon/icon-1024.png"
  adaptive_icon_monochrome: "assets/icon/icon-mono-1024.png"

flutter_native_splash:
  color: "#0D1016"
  fullscreen: true
  android_12:
    color: "#0D1016"
